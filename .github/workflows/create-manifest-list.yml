name: Generate Manifest List

on:
  schedule:
    - cron: '0 */5 * * *'
  workflow_dispatch:

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Clone Target Repository
        env:
          GH_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          git clone --branch depotcache https://x-access-token:${GH_TOKEN}@github.com/myaneku/deapot.git deapot_repo

      - name: Generate JSON List
        run: |
          cd deapot_repo
          find . -maxdepth 1 -name "*.manifest" -printf "%f\n" | jq -R . | jq -s . > list_manifest.json
          echo "Berhasil mendata $(jq 'length' list_manifest.json) file manifest."

      - name: Push to Main Branch
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          cd deapot_repo
          
          MANIFEST_DATA=$(cat list_manifest.json)
          
          rm list_manifest.json
          
          git fetch origin main
          git checkout -f main
          
          echo "$MANIFEST_DATA" > list_manifest.json
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add list_manifest.json
          if git diff --staged --quiet; then
            echo "Tidak ada perubahan pada list_manifest.json"
          else
            git commit -m "Update list_manifest.json"
            git push origin main
          fi
